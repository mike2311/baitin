name: Phase 3 Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/src/shipping-order/**'
      - 'backend/src/delivery-note/**'
      - 'backend/src/loading/**'
      - 'backend/src/invoice/**'
      - 'backend/src/enquiry/**'
      - 'backend/src/reporting/**'
      - 'backend/src/phase3-*.spec.ts'
      - 'backend/src/performance/**'
      - 'backend/src/security/**'
      - 'backend/src/regression/**'
      - 'backend/src/validation/**'
      - 'e2e/tests/workflows/**'
      - 'e2e/tests/performance/phase3-*.spec.ts'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/src/shipping-order/**'
      - 'backend/src/delivery-note/**'
      - 'backend/src/loading/**'
      - 'backend/src/invoice/**'
      - 'backend/src/enquiry/**'
      - 'backend/src/reporting/**'
      - 'backend/src/phase3-*.spec.ts'
      - 'backend/src/performance/**'
      - 'backend/src/security/**'
      - 'backend/src/regression/**'
      - 'backend/src/validation/**'
      - 'e2e/tests/workflows/**'
      - 'e2e/tests/performance/phase3-*.spec.ts'
  workflow_dispatch:
  schedule:
    # Run performance tests nightly at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: baitin_dev
          POSTGRES_PASSWORD: baitin_dev_password
          POSTGRES_DB: baitin_poc_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run Phase 3 unit tests
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: 5432
          TEST_DATABASE_USER: baitin_dev
          TEST_DATABASE_PASSWORD: baitin_dev_password
          TEST_DATABASE_NAME: baitin_poc_dev
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: baitin_dev
          DATABASE_PASSWORD: baitin_dev_password
          DATABASE_NAME: baitin_poc_dev
          NODE_ENV: test
        run: |
          cd backend
          npm test -- --testPathPattern="(shipping-order|delivery-note|loading|invoice|enquiry|reporting)" --coverage
      
      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: phase3-unit-test-coverage
          path: backend/coverage
          retention-days: 30

  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: baitin_dev
          POSTGRES_PASSWORD: baitin_dev_password
          POSTGRES_DB: baitin_poc_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run Phase 3 integration tests
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: 5432
          TEST_DATABASE_USER: baitin_dev
          TEST_DATABASE_PASSWORD: baitin_dev_password
          TEST_DATABASE_NAME: baitin_poc_dev
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: baitin_dev
          DATABASE_PASSWORD: baitin_dev_password
          DATABASE_NAME: baitin_poc_dev
          NODE_ENV: test
        run: |
          cd backend
          npm test -- --testPathPattern="phase3-(workflow|cross-module)" --coverage
      
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: phase3-integration-test-results
          path: backend/coverage
          retention-days: 30

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      - name: Build backend
        run: cd backend && npm run build
      
      - name: Build frontend
        run: cd frontend && npm run build
      
      - name: Start backend server
        run: |
          cd backend
          npm run start:prod &
          sleep 10
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: baitin_dev
          DATABASE_PASSWORD: baitin_dev_password
          DATABASE_NAME: baitin_poc_dev
          NODE_ENV: production
          JWT_SECRET: test-secret-key
          PORT: 3000
      
      - name: Start frontend server
        run: |
          cd frontend
          npm run preview &
          sleep 5
        env:
          VITE_API_URL: http://localhost:3000/api
      
      - name: Run Phase 3 E2E tests
        run: |
          npm run test:e2e -- --grep "Phase 3|SO|DN|Loading|Invoice|Reporting|Complete"
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:3000/api
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: phase3-e2e-report
          path: playwright-report/
          retention-days: 30

  performance-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: baitin_dev
          POSTGRES_PASSWORD: baitin_dev_password
          POSTGRES_DB: baitin_poc_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run API performance tests
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: 5432
          TEST_DATABASE_USER: baitin_dev
          TEST_DATABASE_PASSWORD: baitin_dev_password
          TEST_DATABASE_NAME: baitin_poc_dev
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: baitin_dev
          DATABASE_PASSWORD: baitin_dev_password
          DATABASE_NAME: baitin_poc_dev
          NODE_ENV: test
        run: |
          cd backend
          npm test -- --testPathPattern="phase3-api-performance" --verbose
      
      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: phase3-performance-results
          path: backend/test-results/
          retention-days: 90

  security-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: baitin_dev
          POSTGRES_PASSWORD: baitin_dev_password
          POSTGRES_DB: baitin_poc_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run security tests
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: 5432
          TEST_DATABASE_USER: baitin_dev
          TEST_DATABASE_PASSWORD: baitin_dev_password
          TEST_DATABASE_NAME: baitin_poc_dev
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: baitin_dev
          DATABASE_PASSWORD: baitin_dev_password
          DATABASE_NAME: baitin_poc_dev
          NODE_ENV: test
        run: |
          cd backend
          npm test -- --testPathPattern="phase3-(authz|data-security)"
      
      - name: Upload security test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: phase3-security-results
          path: backend/test-results/
          retention-days: 90

  regression-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: baitin_dev
          POSTGRES_PASSWORD: baitin_dev_password
          POSTGRES_DB: baitin_poc_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run Phase 2 regression tests
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: 5432
          TEST_DATABASE_USER: baitin_dev
          TEST_DATABASE_PASSWORD: baitin_dev_password
          TEST_DATABASE_NAME: baitin_poc_dev
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: baitin_dev
          DATABASE_PASSWORD: baitin_dev_password
          DATABASE_NAME: baitin_poc_dev
          NODE_ENV: test
        run: |
          cd backend
          npm test -- --testPathPattern="(phase2-regression|cross-phase-integration)"
      
      - name: Upload regression test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: phase3-regression-results
          path: backend/test-results/
          retention-days: 30
  
  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, security-tests, regression-tests]
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## Phase 3 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression Tests | ${{ needs.regression-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Performance Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Performance tests run on schedule (nightly) or manual trigger" >> $GITHUB_STEP_SUMMARY